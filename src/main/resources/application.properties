spring.application.name=sihaniwala-foundation

server.port=${PORT:8080}

# PostgreSQL
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/sihaniwala_foundation}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:*******}
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.connection-test-query=SELECT 1

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# schema.sql is kept only as a manual reference for the DB structure. It is
# intentionally NOT auto-executed (mode=never): ddl-auto=update already
# manages the schema from the @Entity classes, and schema.sql contains
# destructive DROP TABLE statements that must never run automatically
# against a live production database.
spring.sql.init.mode=never

# Default admin account, created automatically on first startup if it
# doesn't already exist (see DataSeeder.java). Override these via env vars
# before your FIRST production deploy so the default password is never used.
admin.seed.email=${ADMIN_SEED_EMAIL:admin@sihaniwala.org}
admin.seed.password=${ADMIN_SEED_PASSWORD:*******}

# JWT
jwt.secret=${JWT_SECRET:local-dev-only-secret-change-me-before-deploying-this-is-not-secure}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Razorpay - set real values via env vars (RAZORPAY_KEY_ID / RAZORPAY_KEY_SECRET).
# Do not commit real keys to source control.
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}

# PayPal - set real values via env vars (PAYPAL_CLIENT_ID / PAYPAL_CLIENT_SECRET).
# Do not commit real keys to source control.
paypal.client.id=${PAYPAL_CLIENT_ID:}
paypal.client.secret=${PAYPAL_CLIENT_SECRET:}
paypal.mode=${PAYPAL_MODE:sandbox}

# Mail - set real values via env vars (MAIL_USERNAME / MAIL_PASSWORD = a
# Gmail App Password, not your account password). Do not commit real
# credentials to source control.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# File Upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
file.upload.dir=uploads

# CORS - add your real production domain(s) here via env var, comma-separated
cors.allowed.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Logging
logging.level.com.sihaniwala=INFO
